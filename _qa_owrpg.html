<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="data:,">
<meta charset="UTF-8">
<title>Blackout Ops — Open World RPG QA Suite</title>
<style>
  body { margin: 0; background: #0a0b08; color: #e7e5e4; font-family: monospace; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  #bar { display: flex; align-items: center; gap: 10px; padding: 6px 10px; background: #14120c; border-bottom: 1px solid #3a2f17; }
  #status { font-weight: bold; color: #f5a623; }
  #main { display: flex; flex: 1; min-height: 0; }
  #log { width: 470px; overflow-y: auto; padding: 10px; border-right: 1px solid #3a2f17; font-size: 11.5px; line-height: 1.45; }
  iframe { flex: 1; border: 0; }
  .pass { color: #4ade80; } .fail { color: #f87171; font-weight: bold; } .info { color: #a8a29e; }
</style>
</head>
<body>
<div id="bar"><span id="status">RUNNING…</span><span class="info">Boots index.html in an iframe, runs the OWRPG validator and scripted playthroughs. Real localStorage is snapshotted and restored.</span></div>
<div id="main"><div id="log"></div><iframe id="game" src="about:blank"></iframe></div>
<script>
(async function () {
  const logEl = document.getElementById('log'), statusEl = document.getElementById('status');
  const results = [];
  const log = (m, c = '') => { const d = document.createElement('div'); d.className = c; d.textContent = m; logEl.appendChild(d); logEl.scrollTop = logEl.scrollHeight; };
  const check = (name, cond, detail = '') => { results.push(!!cond); log(`${cond ? 'PASS' : 'FAIL'} — ${name}${detail ? ' (' + detail + ')' : ''}`, cond ? 'pass' : 'fail'); };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  // Snapshot real storage; tests run on a scratch copy and the original is restored on exit.
  const saved = {};
  for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); saved[k] = localStorage.getItem(k); }
  const restore = () => { localStorage.clear(); for (const [k, v] of Object.entries(saved)) localStorage.setItem(k, v); };
  window.addEventListener('beforeunload', restore);

  const frame = document.getElementById('game');
  frame.src = 'index.html?qa=owrpg';
  await new Promise((r) => frame.addEventListener('load', r, { once: true }));
  const W = frame.contentWindow;
  const errors = [];
  W.addEventListener('error', (e) => errors.push(e.message));
  for (let i = 0; i < 100 && !(W.BO && W.BO.App && W.BO.OWRPGMode); i++) await wait(100);
  const BO = W.BO;
  try {
    // --- 1. Validator
    const v = BO.OWRPGValidator.runAll();
    check('Validator: 0 errors', v.errors.length === 0, v.errors.slice(0, 3).join(' | '));
    log(`validator warnings: ${v.warnings.length}`, 'info');

    // --- 2. New character + derived stats
    BO.State.paused = true;
    BO.App.startMatch({ mode: 'owrpg', slot: 2, newChar: { name: 'QA', attrs: { BRW: 7, RFX: 5, TCH: 7, PRC: 7, PRS: 7 }, difficulty: 'tactical' } });
    BO.State.paused = true;
    const M = BO.OWRPGMode, s = M.state, P = BO.Player, C = BO.OWRPGCharacter, Q = BO.OWRPGQuests, I = BO.OWRPGInventory;
    check('Mode active on meridian map', M.active && BO.World.mapData.id === 'meridian');
    check('Max HP = 60 + 8·BRW', P.maxHp === 60 + 8 * 7, `hp ${P.maxHp}`);
    check('Carry = 35 + 6·BRW', C.derived(s).maxWeight === 35 + 6 * 7);
    check('Weakspot multiplier = 1.5 + 0.045·PRC', Math.abs(C.derived(s).critMult - (1.5 + 0.045 * 7)) < 1e-6);
    check('XP curve L1 = 600', BO.OWRPGStatsData.xpToNext(1) === 600);
    check('Starter loadout equipped', P.weapons.length === 2 && !!I.equippedEntry(s, 'rig'));

    // --- 3. Combat pipeline + reaction
    const pump = BO.OWRPGWorldData.POIS.find((p) => p.id === 'pump_three');
    P.pos.set(pump.x + 30, BO.World.terrainHeight(pump.x + 30, pump.z) + 0.3, pump.z);
    BO.OWRPGWorldSim.tick1(1);
    const agent = BO.OWRPGAI.agents.find((a) => a.poiId === 'pump_three');
    check('POI streaming spawned agents', !!agent, `${BO.OWRPGAI.agents.length} agents`);
    if (agent) {
      const hp0 = agent.ent.hp;
      BO.OWRPGCombat.applyStatus(agent, 'chill');
      const fired = BO.OWRPGCombat.detonate(agent, 20);
      check('Primer + Detonator fires a reaction', fired === 1 && (agent.ent.hp < hp0 || !agent.alive));
    }

    // --- 4. Quest: three resolution paths
    const resetQ = () => { delete s.quests.q_dry_artery; for (const f of ['culvert_valve_pulled', 'junction_rerouted', 'mags_shutoff', 'kessler_betrayed']) delete s.worldFlags[f]; I.remove(s, 'syndicate_ledger', 9); I.remove(s, 'bypass_valve', 9); };
    // Tech path through dialogue + terminal.
    resetQ();
    let node = BO.OWRPGDialogue.entry(s, 'kessler');
    check('Kessler opens on intro', node === 'intro_1');
    const techIdx = BO.OWRPGDialogueData.TREES.kessler.nodes.intro_1.choices.findIndex((c) => c.req && c.req.attr && c.req.attr[0] === 'TCH');
    BO.OWRPGDialogue.choose(s, 'kessler', 'intro_1', techIdx);
    check('TCH 6 choice grants schematic + starts quest', I.has(s, 'pressure_schematic') && Q.get(s, 'q_dry_artery').stage === 'investigate');
    M.setFlag('junction_rerouted', true);
    check('Reroute advances to report', Q.get(s, 'q_dry_artery').stage === 'report');
    check('Kessler turn-in node', BO.OWRPGDialogue.entry(s, 'kessler') === 'turnin');
    const rep0 = s.factions.militia;
    Q.complete(s, 'q_dry_artery', 'reroute');
    check('Reroute branch completes with Militia rep', Q.get(s, 'q_dry_artery').state === 'completed' && s.factions.militia > rep0);
    // Sequence break: pull the valve before ever meeting Kessler.
    resetQ();
    M.setFlag('culvert_valve_pulled', true);
    check('Sequence break → Kessler reacts (prefixed)', BO.OWRPGDialogue.entry(s, 'kessler') === 'prefixed');
    BO.OWRPGDialogue.choose(s, 'kessler', 'prefixed', 0);
    check('Prefixed node jumps to report', Q.get(s, 'q_dry_artery').stage === 'report');
    // Social path with Mags (PRS 7).
    resetQ();
    Q.start(s, 'q_dry_artery');
    const pumpNode = BO.OWRPGDialogueData.TREES.mags.nodes.pump;
    const prsIdx = pumpNode.choices.findIndex((c) => c.req && c.req.attr && c.req.attr[0] === 'PRS');
    check('PRS 7 option visible + passes', BO.OWRPGDialogue.check(s, pumpNode.choices[prsIdx].req) === '');
    BO.OWRPGDialogue.choose(s, 'mags', 'pump', prsIdx);
    check('Mags shut-off advances quest', s.worldFlags.mags_shutoff && Q.get(s, 'q_dry_artery').stage === 'report');
    const syn0 = s.factions.syndicate;
    Q.complete(s, 'q_dry_artery', 'diplomacy');
    check('Diplomacy branch raises both Militia and Syndicate', s.factions.syndicate > syn0);

    // --- 5. Faction spillover math
    const a0 = s.factions.aegis, h0 = s.factions.helix;
    BO.OWRPGFactions.add(s, 'aegis', 100, { raw: true });
    check('Rival spillover = −50%', s.factions.aegis === a0 + 100 && s.factions.helix === h0 - 50);

    // --- 6. Perks are mutually exclusive
    s.player.level = 6; s.player.perkPoints = 3;
    C.takePerk(s, 'ghost_t1_softstep');
    check('XOR perk locks its pair', C.perkBlock(s, 'ghost_t1_suppressed') === 'Locked by choice');

    // --- 7. Interior enter/exit
    const hatch = BO.OWRPGWorldData.INTERACTS.find((i) => i.id === 'h_culvert');
    BO.OWRPGInteriors.enter(hatch.to, 'culvert');
    check('Entered sealed interior', BO.OWRPGWorldData.isInterior(P.pos.x, P.pos.z));
    const ex = BO.OWRPGWorldData.INTERACTS.find((i) => i.id === 'x_culvert');
    BO.OWRPGInteriors.exit(ex.to);
    check('Exited to the surface', !BO.OWRPGWorldData.isInterior(P.pos.x, P.pos.z) && s.player.interiorId === null);

    // Expansion regression coverage exercises real interactions and streamed entities.
    const D = BO.OWRPGWorldData, Sim = BO.OWRPGWorldSim, Props = BO.OWRPGInteriors, SD = BO.OWRPGStatsData;
    check('Expanded terrain spans 1280 metres', BO.World.terrain.maxX - BO.World.terrain.minX === 1280);
    check('12 regions, 12 dungeons, 70 enemy archetypes and 40 quests', D.REGIONS.length === 12 && D.DUNGEONS.length === 12 && Object.keys(SD.ENEMIES).length === 70 && Object.keys(BO.OWRPGQuestsData.QUESTS).length === 40);
    check('All new characters start at level 1', BO.OWRPGSave.defaultSlot().player.level === 1);
    const oldStone = s.player.standingStone;
    const baseArmor = C.derived(s).armor;
    Props._useProp(Props.props.find(p => p.def.id === 'stone_warrior'));
    check('Stone grants its armor and weapon bonus', C.derived(s).armor === baseArmor + 15 && C.perkFx(s).allDmgMult >= 0.12);
    Props._useProp(Props.props.find(p => p.def.id === 'stone_steed'));
    check('New stone replaces previous blessing', C.derived(s).armor === baseArmor && C.perkFx(s).speedMult >= 0.1);
    s.player.standingStone = oldStone;
    Q.start(s, 'q_elderwood_harvest');
    const nodeProp = Props.props.find(p => p.def.id === 'n_wood_1');
    Props._useProp(nodeProp);
    check('Harvest advances quest and mastery', I.has(s, 'elderwood_log') && Q.get(s, 'q_elderwood_harvest').stage === 'report' && C.skill(s,'foraging').xp > 0);
    const countWood = () => s.player.inventory.filter(e => e.id === 'elderwood_log').reduce((n,e) => n + e.n,0);
    const nWood = countWood();
    Props._useProp(nodeProp);
    check('Gather cooldown prevents duplicate yield', countWood() === nWood);
    s.playtimeSec += 600; Props._useProp(nodeProp);
    check('Gather nodes regrow at 10 minutes', countWood() > nWood);
    const skill = C.skill(s,'combat'); const beforeSkill = skill.level;
    C.addSkillXp(s,'combat',SD.skillXpToNext(skill.level));
    check('Mastery levels change combat bonuses', skill.level === beforeSkill+1 && C.perkFx(s).allDmgMult >= 0.005);
    I.add(s,'elixir_wisdom',1); M.useConsumable(s.player.inventory.find(e=>e.id==='elixir_wisdom').uid);
    check('Wisdom elixir applies timed XP boost', C.perkFx(s).xpMult >= 0.3);
    I.add(s,'elixir_thunderbolt',1); M.useConsumable(s.player.inventory.find(e=>e.id==='elixir_thunderbolt').uid);
    check('Thunderbolt applies healing and surge together', M.stimT === 25 && BO.OWRPGCombat.heal.left > 0);
    const savedPerks = s.player.perks.slice();
    s.player.perks = ['dead_t1_quickdraw','dead_t2_ap','dead_t5_shockround','arc_t1_ward','way_t3_tinker'];
    const testEnemy = BO.OWRPGAI.spawn('raider',P.pos.x+12,P.pos.z,{});
    testEnemy.state='combat';
    const hpBefore=testEnemy.ent.hp;
    BO.OWRPGCombat.damage(testEnemy,10,{source:'gun',dist:25});
    check('Weapon damage/penetration perks affect actual damage', hpBefore-testEnemy.ent.hp > 10);
    check('Elemental resistance perk reaches derived stats', C.derived(s).elemRes.burn >= 0.12);
    BO.OWRPGCombat.hitCount=3; BO.OWRPGCombat._procs(testEnemy,{source:'gun'});
    check('Fourth-hit Shock perk applies real status', !!testEnemy.st.shock);
    const weapon=I.equippedEntry(s,'primary'); weapon.dur=weapon.maxDur;
    BO.OWRPGDurability.degrade(s,weapon,10);
    check('Durability perk reduces actual equipment wear', weapon.maxDur-weapon.dur <= 5.5);
    s.player.perks=savedPerks;
    BO.OWRPGAI.despawn(testEnemy);
    for (const dungeon of D.DUNGEONS.slice(1)) {
      const gate=Props.props.find(p=>p.def.dngId===dungeon.id);
      Props._useProp(gate);
      check('Dungeon accessible: '+dungeon.name, s.player.interiorId===dungeon.id && Sim.poiAgents[dungeon.id]?.some(a=>a.defId===dungeon.boss) && BO.World.hasHeadroom(P.pos.x,P.pos.y,P.pos.z,0.3,1.7));
      // Move through the archways to the boss dais to exercise interior collision and AI.
      for (const zOff of [4,18,32,44,56]) {
        const y=BO.World.getGroundHeight(dungeon.x,dungeon.z+zOff,2);
        check('Dungeon route clear: '+dungeon.id+'/'+zOff, Number.isFinite(y) && BO.World.hasHeadroom(dungeon.x,y,dungeon.z+zOff,0.3,1.7));
      }
      Props.exit({...dungeon.surf,yaw:0});
    }
    const respawnPoi=D.POIS.find(p=>p.id==='dng_whisper_barrow');
    const gate=Props.props.find(p=>p.def.dngId===respawnPoi.id);
    Props._useProp(gate);
    const victim=Sim.poiAgents[respawnPoi.id][0];
    BO.OWRPGCombat.damage(victim,100000,{source:'gun'});
    const spawnIndex=victim.spawnIndex;
    Sim.tick1(1);
    check('Enemy stays dead before respawn interval', !Sim.poiAgents[respawnPoi.id].find(a=>a.spawnIndex===spawnIndex).alive);
    s.playtimeSec+=600; Sim.tick1(1);
    check('Enemy respawns after 10 minutes', Sim.poiAgents[respawnPoi.id].find(a=>a.spawnIndex===spawnIndex).alive);
    const boss=Sim.poiAgents[respawnPoi.id].find(a=>a.boss);
    BO.OWRPGCombat.damage(boss,100000,{source:'gun'});
    Props.exit({...D.DUNGEONS[1].surf,yaw:0}); Props._useProp(gate);
    check('Leaving and returning respawns bosses too', Sim.poiAgents[respawnPoi.id].some(a=>a.boss&&a.alive));
    Props.exit({...D.DUNGEONS[1].surf,yaw:0});
    BO.OWRPGPipPad.open('map');
    const map=W.document.getElementById('ow-map'), rect=map.getBoundingClientRect();
    map.onclick({clientX:rect.left+rect.width*0.9,clientY:rect.top+rect.height*0.9});
    check('Map pins cover expanded outer regions', s.pins.some(p=>p[0]>500&&p[1]>500));
    BO.OWRPGPipPad.open('mastery');
    check('Seven mastery cards render', W.document.querySelectorAll('.ow-mastery').length===7);
    BO.OWRPGPipPad.open('system');
    check('System exposes developer menu', !!W.document.querySelector('[data-v="dev"]'));
    BO.OWRPGUI.close(true);
    P.yaw=0; s.worldFlags.compassEnabled=true;
    check('Compass shows north at north bearing', BO.OWRPGUI._compassHtml(null).includes('>N</b>'));
    s.worldFlags.compassEnabled=false;
    check('Compass can be hidden', BO.OWRPGUI._compassHtml(null)==='');
    s.worldFlags.compassEnabled=true;
    check('21 world events have valid enemy/loot definitions', BO.OWRPGEvents.types.length===21 && BO.OWRPGEvents.types.every(e=>SD.LOOT[e.loot]&&e.enemies.every(id=>SD.ENEMIES[id])));
    const migratedV2=BO.OWRPGSave.migrate({schemaVersion:2,slots:[{player:{name:'VETERAN',level:17,xp:1234,perks:['ghost_t1_softstep']}}]}).slots[0];
    check('Schema 2 upgrade retains progression and adds mastery', migratedV2.player.level===17 && migratedV2.player.xp===1234 && migratedV2.player.perks[0]==='ghost_t1_softstep' && migratedV2.player.skills.combat.level===1);
    // --- 7b. Cartography, Discoveries, Champions, tracker (flagship-2)
    const Carto = BO.OWRPGCartography, Disc = BO.OWRPGDiscoveries, Champ = BO.OWRPGChampions;
    check('New systems registered with the mode', ['cartography','discoveries','champions'].every(id => M.systems.some(sy => sy.id === id)));
    const exp0 = Carto.explored;
    const fresh = Carto.reveal(300, -300, 90);
    check('Reveal charts new fog cells', fresh > 0 && Carto.explored === exp0 + fresh && Carto.isExplored(300, -300));
    const enc = s.atlas.explored; Carto._decode(enc);
    check('Explored bitset round-trips through base64', Carto.explored === exp0 + fresh && enc.length <= 700);
    check('Region completion is reported', Carto.regionPercent(D.regionAt(300, -300).id) > 0);
    Carto._drawMinimap();
    check('Minimap canvas is on the HUD', !!W.document.querySelector('#ow-minimap canvas') && Carto.range() >= 95);
    const r0 = Carto.revealRadius(); s.player.perks.push('path_t1_cartographer');
    check('Cartographer perk widens the reveal radius', Carto.revealRadius() > r0 * 1.3);
    s.player.perks.pop();
    check('9 perk trees × 6 tiers', Object.keys(SD.PERK_TREES).length === 9 && Object.values(SD.PERK_TREES).every(t => t.tiers.length === 6));
    const perType = {}; Disc.sites.forEach(x => perType[x.type] = (perType[x.type] || 0) + 1);
    check('150+ hidden sites across 7 types', Disc.sites.length >= 150 && Object.keys(perType).length === 7, Disc.sites.length + ' sites');
    check('Every region has a vista for the Eyes quest', perType.vista === 12);
    const cache = Disc.sites.find(x => x.type === 'cache' && !Disc.isFound(x));
    const cr0 = s.player.credits;
    Disc.interact({ obj: cache });
    check('Opening a cache pays out and marks it found', Disc.isFound(cache) && s.player.credits > cr0);
    check('First cache auto-starts Fortune Favours the Bold', Q.get(s, 'q_fortune_bold').state === 'active');
    const tome = Disc.sites.find(x => x.type === 'tome');
    Disc.interact({ obj: tome });
    check('Lore tome opens the reader', BO.OWRPGUI.kind === 'lore' && !!W.document.querySelector('.ow-tome h2'));
    BO.OWRPGUI.close(true);
    const shrine = Disc.sites.find(x => x.type === 'shrine');
    Disc.interact({ obj: shrine });
    check('Shrine blessing feeds perk effects', !!s.player.blessing && s.player.blessing.until > s.playtimeSec && Object.keys(s.player.blessing.fx).every(k => (C.perkFx(s)[k] || 0) !== 0));
    check('Shrine goes on cooldown', !Disc.shrineReady(shrine));
    const vista = Disc.sites.find(x => x.type === 'vista' && !Carto.isExplored(x.x, x.z)) || Disc.sites.find(x => x.type === 'vista');
    const pct0 = Carto.explored; Disc.interact({ obj: vista });
    check('Vista charts a wide area', Carto.explored > pct0 + 30 && Q.get(s, 'q_eyes_expanse').state === 'active');
    const foe = BO.OWRPGAI.spawn('raider', P.pos.x + 18, P.pos.z, { noChampion: true });
    foe.hostile = true; foe.eventHostile = true;
    const hp0c = foe.ent.maxHp;
    Champ.make(foe, 2, ['shielded']);
    check('Champion: tougher, affixed and labelled', foe.champ && foe.ent.maxHp > hp0c * 2 && foe.champ.affixes.length === 2 && Champ.label(foe).includes('Shielded'));
    foe.champ.cycle = 1; const shieldM = Champ.takenMult(foe); foe.champ.cycle = 5;
    check('Shielded affix blocks damage while up', shieldM < Champ.takenMult(foe));
    const killed0 = s.atlas.champions || 0;
    BO.OWRPGCombat.damage(foe, 1e6, { source: 'gun' });
    check('Champion kill is counted and starts the hunter quest', (s.atlas.champions || 0) === killed0 + 1 && Q.get(s, 'q_champion_hunter').state === 'active');
    Q.start(s, 'q_overpass_bounty');
    BO.OWRPGUI.toggleTrack('q_overpass_bounty'); BO.OWRPGUI.toggleTrack('q_fortune_bold');
    check('Tracker follows up to three chosen quests', BO.OWRPGUI.trackedQuests().length === 2 && BO.OWRPGUI.trackedQuests()[0] === 'q_fortune_bold');
    BO.OWRPGUI.updateHud();
    check('HUD tracker renders each tracked quest', W.document.querySelectorAll('#ow-quest .ow-qt').length === 2);
    BO.OWRPGPipPad.open('atlas');
    check('Atlas tab renders region rows', W.document.querySelectorAll('.ow-atlas-row').length === 12);
    BO.OWRPGUI.close(true);
    const noNav = BO.OWRPGSave.defaultSlot({ compass: false, minimap: false });
    check('Creator can start with compass and minimap off', noNav.worldFlags.compassEnabled === false && noNav.worldFlags.minimapEnabled === false);
    const migV3 = BO.OWRPGSave.migrate({ schemaVersion: 3, slots: [{ player: { name: 'V3', level: 9 } }] }).slots[0];
    check('Schema 3 saves gain the atlas', migV3.player.level === 9 && migV3.atlas && typeof migV3.atlas.found === 'object');
    BO.FX.update(5);   // expire the celebration particles so the frame-budget check below measures the world
    const vr = BO.OWRPGValidator.runAll();
    check('Validator still clean with discoveries', vr.errors.length === 0, vr.errors.slice(0, 2).join(' | '));

    // --- 8. Save round-trip
    BO.OWRPGAI.clear();
    P.onGround = true;
    M.save(2, 'QA');
    const raw = JSON.stringify(BO.OWRPGSave.read(2));
    const before = JSON.stringify(M._snapshot());
    s.player.credits = -999;
    const back = BO.OWRPGSave.read(2);
    check('Save → wipe → read deep-equals', JSON.stringify(back) === raw && raw === before);
    const migrated = BO.OWRPGSave.migrate({ schemaVersion: 1, slots: [{ player: { name: 'OLD' } }] });
    check('Migration fills missing keys', migrated.slots[0].player.attrs && migrated.slots[0].factions && migrated.slots[0].quests);
    check('Save size < 250 KB', BO.OWRPGSave.byteSize() < 250 * 1024, (BO.OWRPGSave.byteSize() / 1024).toFixed(1) + ' KB');

    // --- 9. Frame budget
    BO.State.paused = false;
    await wait(800);
    // Settle LOD, streaming and fog culling for the current position before counting (headless rAF can stall).
    for (let n = 0; n < 3; n++) { P.update(1 / 60, BO.App.worldCamera); M.update(1 / 60); }
    const r = BO.App.renderer;
    r.info.autoReset = false; r.info.reset();
    await new Promise((res) => W.requestAnimationFrame(res));
    const calls = r.info.render.calls; r.info.autoReset = true;
    // Frame cost (sim + world render), independent of the host's vsync/throttling.
    BO.State.paused = true;
    const times = [];
    for (let n = 0; n < 12; n++) {
      const t0 = W.performance.now();
      P.update(1 / 60, BO.App.worldCamera); M.update(1 / 60);
      r.render(BO.World.scene, BO.App.worldCamera); r.getContext().finish();
      times.push(W.performance.now() - t0);
    }
    times.sort((a, b) => a - b);
    const med = times[Math.floor(times.length / 2)];
    check('Draw calls < 200 (target 180)', calls < 200, `${calls} calls`);
    const gl=r.getContext(), debug=gl.getExtension('WEBGL_debug_renderer_info');
    const gpu=debug ? gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) : '';
    if (/SwiftShader|llvmpipe|Software/i.test(gpu)) log('Hardware frame-budget check skipped on software renderer: '+med.toFixed(1)+' ms · '+gpu,'info');
    else check('Median frame cost < 16.6 ms', med < 16.6, med.toFixed(1) + ' ms · '+gpu);

    BO.OWRPGSave.remove(2);
    BO.App.exitToMenu();
    check('No uncaught errors', errors.length === 0, errors.slice(0, 2).join(' | '));
  } catch (e) {
    check('Suite crashed', false, e.stack);
  }
  restore();
  const pass = results.filter(Boolean).length;
  statusEl.textContent = `${pass} / ${results.length} PASSED`;
  statusEl.style.color = pass === results.length ? '#4ade80' : '#f87171';
  window.__qaResult = { pass, total: results.length };
})();
</script>
</body>
</html>
