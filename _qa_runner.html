<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blackout Ops — Whole-Game Smoke QA</title>
<style>
  body { margin: 0; background: #0a0b0d; color: #e7e5e4; font-family: monospace; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  #bar { display: flex; align-items: center; gap: 10px; padding: 6px 10px; background: #111318; border-bottom: 1px solid #2a2f3a; }
  #status { font-weight: bold; color: #38bdf8; }
  #main { display: flex; flex: 1; min-height: 0; }
  #log { width: 520px; overflow-y: auto; padding: 10px; border-right: 1px solid #2a2f3a; font-size: 11.5px; line-height: 1.45; }
  iframe { flex: 1; border: 0; }
  .pass { color: #4ade80; } .fail { color: #f87171; font-weight: bold; } .info { color: #94a3b8; }
</style>
</head>
<body>
<div id="bar"><span id="status">RUNNING…</span><span class="info">Boots index.html in an iframe, starts every mode and all minigames, and fails on any uncaught error. Real localStorage is snapshotted and restored. Open-world details live in _qa_owrpg.html.</span></div>
<div id="main"><div id="log"></div><iframe id="game" src="about:blank"></iframe></div>
<script>
(async function () {
  const logEl = document.getElementById('log'), statusEl = document.getElementById('status');
  const results = [];
  const log = (m, c = '') => { const d = document.createElement('div'); d.className = c; d.textContent = m; logEl.appendChild(d); logEl.scrollTop = logEl.scrollHeight; };
  const check = (name, cond, detail = '') => { results.push(!!cond); log(`${cond ? 'PASS' : 'FAIL'} — ${name}${detail ? ' (' + detail + ')' : ''}`, cond ? 'pass' : 'fail'); };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  const saved = {};
  for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); saved[k] = localStorage.getItem(k); }
  const restore = () => { localStorage.clear(); for (const [k, v] of Object.entries(saved)) localStorage.setItem(k, v); };
  window.addEventListener('beforeunload', restore);

  const frame = document.getElementById('game');
  frame.src = 'index.html?qa=runner';
  await new Promise((r) => frame.addEventListener('load', r, { once: true }));
  const win = frame.contentWindow, doc = frame.contentDocument;
  const errors = [];
  win.addEventListener('error', (e) => errors.push(e.message));
  win.addEventListener('unhandledrejection', (e) => errors.push('promise: ' + (e.reason && e.reason.message || e.reason)));
  for (let i = 0; i < 150 && !(win.BO && win.BO.App && win.BO.App.renderer && win.BO.Minigames); i++) await wait(100);
  const BO = win.BO;
  BO.App._safePointerLock = () => {};
  // Steps the game manually (same order as App._loop) so the suite does not depend on
  // requestAnimationFrame running in a background tab, then renders one frame.
  const MODE_UPDATE = { survival: () => BO.SurvivalMode, minigame: () => BO.Minigames, zombies: () => BO.ZombiesMode, mp: () => BO.MPMode, rpg: () => BO.RPGMode, owrpg: () => BO.OWRPGMode, td: () => BO.TowerDefenseMode };
  const step = (frames = 30) => {
    const cam = BO.App.worldCamera, dt = 1 / 60;
    for (let i = 0; i < frames; i++) {
      if (BO.State.screen !== 'playing' || BO.State.paused) break;
      if (BO.State.activeMode === 'minigame') BO.Minigames.preUpdate(dt);
      BO.Player.update(dt, cam);
      BO.Combat.updateBurstAndProjectiles(dt, cam);
      BO.FX.update(dt);
      const m = MODE_UPDATE[BO.State.activeMode] && MODE_UPDATE[BO.State.activeMode]();
      if (m) m.update(dt);
    }
    if (BO.World.scene) BO.App.renderer.render(BO.World.scene, cam);
  };
  const errCount = () => errors.length;

  try {
    // 1. Boot + shared systems
    check('Core namespace, renderer and every mode module loaded', !!(BO.App && BO.ZombiesMode && BO.MPMode && BO.TowerDefenseMode && BO.SurvivalMode && BO.RPGMode && BO.OWRPGMode && BO.Minigames));
    const MM = BO.ModifierMenuUI;
    let presetsOk = true;
    for (const mode of ['survival', 'zombies', 'mp', 'td']) {
      const preset = MM.savePreset(mode, 'QA_' + mode, mode === 'survival' ? ['sv_unlimited_tech'] : ['bigHeads']);
      const listed = MM.listPresets(mode);
      if (!preset || !listed.some((p) => p.name === 'QA_' + mode)) presetsOk = false;
      if (preset) MM.deletePreset(mode, preset.id);
    }
    check('Modifier presets create/list/delete in all 4 modes', presetsOk);
    BO.Menus.openLegend();
    BO.Menus.legendTab = 'not-a-mode';
    BO.Menus.renderLegend();
    check('Mode Guide recovers from an unknown tab', BO.ModeGuide.MODES[BO.Menus.legendTab] && doc.querySelectorAll('#legend-tabs button').length >= 7);
    doc.getElementById('modal-legend')?.classList.add('hidden');
    const ul = BO.UpdateLogData.updates;
    check('Update log has unique ids, titles and blocks', ul.length >= 180 && new Set(ul.map((u) => u.id)).size === ul.length && ul.every((u) => u.title && u.blocks.length));

    // 2. Every mode starts, runs and exits cleanly
    const modes = [
      ['Zombies (Der Bunker)', { mode: 'zombies', mapId: 'der_bunker', difficulty: 'normal' }, () => BO.ZombiesMode.active !== false],
      ['Multiplayer (Killhouse TDM)', { mode: 'mp', mapId: 'killhouse', modeType: 'tdm', difficulty: 'regular', customRules: { enemyCount: 2 } }, () => BO.MPMode.bots && BO.MPMode.bots.length > 0],
      ['Tower Defense (Castle 1)', { mode: 'td', mapId: 'td_castle_1' }, () => !!BO.TowerDefenseMode],
      ['Survival (Exclusion Zone)', { mode: 'survival', mapId: 'exclusion_zone', gameType: 'freeplay', difficulty: 'standard', autosave: false, modifiers: [], disabledEnemies: [] }, () => BO.SurvivalMode.active],
      ['Rogue Lite', { mode: 'rpg', startFloor: 1 }, () => BO.RPGMode.active !== false],
      ['Open World RPG', { mode: 'owrpg', slot: 2, newChar: { name: 'RUNNER', attrs: { BRW: 5, RFX: 5, TCH: 5, PRC: 5, PRS: 5 }, difficulty: 'tactical' } }, () => BO.OWRPGMode.active && BO.World.mapData.id === 'meridian']
    ];
    for (const [label, opts, ok] of modes) {
      const e0 = errCount();
      try {
        BO.App.startMatch(opts);
        await wait(700);
        step(20);
        check('Mode boots and runs: ' + label, ok() && errCount() === e0, errors.slice(e0, e0 + 1).join(''));
      } catch (e) { check('Mode boots and runs: ' + label, false, e.message); }
      try { BO.App.exitToMenu(); } catch (e) { check('Exit to menu: ' + label, false, e.message); }
      await wait(150);
    }
    BO.OWRPGSave.remove(2);

    // 3. All minigames
    const ids = Object.keys(BO.Minigames.order).flatMap((c) => BO.Minigames.order[c]);
    let mgFails = [];
    for (const id of ids) {
      const e0 = errCount();
      try {
        BO.App.startMatch({ mode: 'minigame', mapId: 'mg_' + id, mgId: id, mgOptions: { skipCountdown: true } });
        await wait(120);
        step(30);
        if (!BO.Minigames.active || errCount() !== e0) mgFails.push(id + (errors[e0] ? ': ' + errors[e0] : ''));
      } catch (e) { mgFails.push(id + ': ' + e.message); }
      try { BO.App.exitToMenu(); } catch (e) { mgFails.push(id + ' exit: ' + e.message); }
    }
    check(`All ${ids.length} minigames start, tick and exit`, ids.length >= 63 && mgFails.length === 0, mgFails.slice(0, 3).join(' | '));
    check('Minigame feel layer + daily featured loaded', !!BO.MinigameFeel && BO.MinigameDaily.picks().length === 3 && new Set(BO.MinigameDaily.picks().map((p) => p.def.id)).size === 3);
    const sameDay = BO.MinigameDaily.picks('2026-11-27').map((p) => p.def.id).join();
    check('Daily featured picks are stable for a date', sameDay === BO.MinigameDaily.picks('2026-11-27').map((p) => p.def.id).join() && sameDay !== BO.MinigameDaily.picks('2026-11-28').map((p) => p.def.id).join());
    check('Material-matched impacts', BO.MinigameFeel.materialOf({ kind: 'bottle' }) === 'glass' && BO.MinigameFeel.materialOf({ death: 'pop' }) === 'soft' && BO.MinigameFeel.materialOf({}) === 'steel');

    check('No uncaught errors across the whole run', errors.length === 0, errors.slice(0, 3).join(' | '));
  } catch (e) {
    check('Unhandled QA runner exception', false, e.stack || e.message);
  }
  restore();
  const passed = results.filter(Boolean).length;
  statusEl.textContent = `COMPLETE: ${passed}/${results.length} PASSED`;
  statusEl.style.color = passed === results.length ? '#4ade80' : '#f87171';
  log(`COMPLETE: ${passed}/${results.length} checks passed (localStorage restored).`, 'info');
})();
</script>
</body>
</html>
